services:
  - type: web
    name: student-feedback-intelligence-api
    runtime: python
    region: oregon
    plan: free
    rootDir: student-feedback-intelligence
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://student-feedback-intelligence-2-0.vercel.app,https://student-feedback-intelligence.vercel.app
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
    healthCheckPath: /health
