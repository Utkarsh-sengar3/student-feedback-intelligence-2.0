services:
  - type: web
    name: student-feedback-intelligence-api
    runtime: python
    region: oregon
    plan: free
    rootDir: student-feedback-intelligence
    buildCommand: pip install -r requirements-api.txt && python -c "import os, urllib.request; os.makedirs('models/embeddings', exist_ok=True); print('Downloading ONNX model during build...'); urllib.request.urlretrieve('https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx', 'models/embeddings/model.onnx'); print('ONNX model ready!')"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://student-feedback-intelligence-2-0.vercel.app,https://student-feedback-intelligence.vercel.app
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
    healthCheckPath: /health
